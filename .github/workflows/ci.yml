name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The core has no Apple-only frameworks. Linux checks it with a second compiler and runs the lint.
  test-linux:
    name: test-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # Check out the code.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version
      - name: Lint
        run: swift format lint --strict --recursive Package.swift Sources Tests
      - name: Build
        run: swift build --build-tests --disable-automatic-resolution -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test --skip-build

  build-and-test-macos:
    name: build-and-test-macos
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read # Check out the code.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build --build-tests --disable-automatic-resolution -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test --skip-build
